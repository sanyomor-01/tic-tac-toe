<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>100devs TicTacToe</title>
    <link rel="stylesheet" href="/tic-tac-toe/css/style.css" />
    <link rel="stylesheet" href="/tic-tac-toe/css/reset.css" />
  </head>
  <body>
    <main>
      <header>
        <h1><span class="blue">Tic</span>Tac<span class="blue">Toe</span></h1>
        <p class="status">X's turn</p>
      </header>

      <div id="game-board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      <button id="restart">Restart</button>
    </main>
    <script src="/tic-tac-toe/js/main.js"></script>
  </body>
</html>
